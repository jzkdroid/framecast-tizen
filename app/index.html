<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>FrameCast</title>
    <link rel="stylesheet" href="css/app.css">
    <!-- Samsung TV APIs (AVPlay). Only resolves on the TV; harmless 404 elsewhere. -->
    <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
    <!-- Video layer: AVPlay renders into this object on the TV; <video> is the browser fallback -->
    <object id="av-player" type="application/avplayer"></object>
    <video id="html-player" playsinline></video>

    <!-- Login -->
    <section id="login-screen" class="screen">
        <div class="login-card">
            <div class="brand">Frame<span>Cast</span></div>
            <p class="hint">Sign in with your IPTV provider's Xtream Codes details.</p>
            <label>Server URL
                <input id="login-url" class="focusable" data-nav="login" type="url" placeholder="http://provider.example:8080">
            </label>
            <label>Username
                <input id="login-user" class="focusable" data-nav="login" type="text" autocomplete="off">
            </label>
            <label>Password
                <input id="login-pass" class="focusable" data-nav="login" type="password" autocomplete="off">
            </label>
            <button id="login-btn" class="focusable btn" data-nav="login">Sign in</button>
            <p id="login-error" class="error" role="alert"></p>
        </div>
    </section>

    <!-- Browser: categories | channels | details -->
    <section id="browse-screen" class="screen hidden">
        <header class="topbar">
            <div class="brand small">Frame<span>Cast</span></div>
            <div id="clock" class="clock"></div>
        </header>
        <div class="columns">
            <nav class="col categories">
                <div class="col-title">Categories</div>
                <ul id="category-list" class="list"></ul>
            </nav>
            <main class="col channels">
                <div class="col-title" id="channel-title">Channels</div>
                <div id="search-box" class="search-box hidden">
                    <input id="search-input" type="text" placeholder="Type a channel name">
                </div>
                <ul id="channel-list" class="list"></ul>
                <div id="channel-empty" class="empty hidden"></div>
            </main>
            <aside class="col details">
                <div id="preview" class="preview"><div class="preview-label">Preview</div></div>
                <div id="detail-name" class="detail-name"></div>
                <ol id="detail-epg" class="epg-list"></ol>
            </aside>
        </div>
        <footer class="keyhints">
            <span><b class="key ok">OK</b> Watch</span>
            <span><b class="key red"></b> Favorite</span>
            <span><b class="key yellow"></b> Search</span>
            <span><b class="key blue"></b> Sign out</span>
            <span><b class="key">BACK</b> Exit</span>
        </footer>
    </section>

    <!-- Full-screen playback overlay -->
    <section id="player-screen" class="screen hidden">
        <div id="osd" class="osd">
            <div class="osd-top">
                <span id="osd-num" class="osd-num"></span>
                <img id="osd-logo" class="osd-logo" alt="">
                <span id="osd-name" class="osd-name"></span>
                <span id="osd-fav" class="osd-fav"></span>
            </div>
            <div id="osd-now" class="osd-now"></div>
            <div class="osd-progress"><div id="osd-bar"></div></div>
            <div id="osd-next" class="osd-next"></div>
            <div class="osd-hints">CH ▲▼ / ▲▼ change channel · INFO / OK show this · BACK channel list</div>
        </div>
        <div id="player-status" class="player-status hidden"></div>
    </section>

    <div id="toast" class="toast hidden"></div>

    <script src="js/storage.js"></script>
    <script src="js/xtream.js"></script>
    <script src="js/player.js"></script>
    <script src="js/keys.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
